name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-documentation-${{ github.ref }}
  # docs-contract can become a required check after a verified run.
  cancel-in-progress: false

jobs:
  prepare_docs:
    name: prepare-documentation-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation_python: ${{ steps.toolchain.outputs.documentation_python }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read tooling policy
        id: toolchain
        run: python scripts/ci_toolchain.py emit-github-output >> "$GITHUB_OUTPUT"

  docs-contract:
    name: docs-contract
    needs: prepare_docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.prepare_docs.outputs.documentation_python }}
          cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pip' || '' }}
          cache-dependency-path: requirements-docs.lock

      - name: Set up Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install npm dependencies from lockfile
        run: npm ci --ignore-scripts --no-fund

      - name: Apply and test braces limit
        run: |
          python scripts/patch_braces.py
          node --test tests/test_braces_guard.cjs

      - name: Lint Markdown with locked dependencies
        run: python scripts/ci_toolchain.py run-markdownlint

      - name: Install documentation tools
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-docs.lock

      - name: Validate policy and lockfile synchronization
        run: python scripts/validate_tooling.py

      - name: Run documentation regression tests
        run: python -m unittest discover -s tests/docs -v

      - name: Validate documentation contract
        run: python scripts/validate_scaffold.py --repository-root .
