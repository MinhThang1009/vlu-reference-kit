name: Tài liệu

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-documentation-${{ github.ref }}
  # docs-contract can become a required check after a verified run.
  cancel-in-progress: false

jobs:
  prepare_docs:
    name: prepare-documentation-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation_python: ${{ steps.toolchain.outputs.documentation_python }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Đọc policy công cụ
        id: toolchain
        run: python scripts/ci_toolchain.py emit-github-output >> "$GITHUB_OUTPUT"

  docs-contract:
    name: docs-contract
    needs: prepare_docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Chuẩn bị Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.prepare_docs.outputs.documentation_python }}
          cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pip' || '' }}
          cache-dependency-path: requirements-docs.lock

      - name: Chuẩn bị Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Cài dependency npm từ lockfile
        run: npm ci --ignore-scripts --no-fund

      - name: Áp dụng và kiểm tra giới hạn braces
        run: |
          python scripts/patch_braces.py
          node --test tests/test_braces_guard.cjs

      - name: Kiểm tra Markdown với dependency đã khóa
        run: python scripts/ci_toolchain.py run-markdownlint

      - name: Cài công cụ kiểm tra tài liệu
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-docs.lock

      - name: Kiểm tra đồng bộ policy và lockfile
        run: python scripts/validate_tooling.py

      - name: Kiểm tra quy ước tài liệu
        run: python scripts/validate_scaffold.py --repository-root .
