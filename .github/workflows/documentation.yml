name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-documentation-${{ github.ref }}
  # docs-contract can become a required check after a verified run.
  cancel-in-progress: false

jobs:
  prepare_docs:
    name: prepare-documentation-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation_python: ${{ steps.toolchain.outputs.documentation_python }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read tooling policy
        id: toolchain
        run: python scripts/ci_toolchain.py emit-github-output >> "$GITHUB_OUTPUT"

  docs-contract:
    name: docs-contract
    permissions:
      contents: read
      pull-requests: read
      issues: read
    needs: prepare_docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.prepare_docs.outputs.documentation_python }}
          check-latest: true
          cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pip' || '' }}
          cache-dependency-path: requirements-docs.lock

      - name: Set up Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install npm dependencies from lockfile
        run: npm ci --ignore-scripts --no-fund

      - name: Apply mitigation and test Markdown parsers
        run: |
          python scripts/patch_braces.py
          node --test tests/test_braces_guard.cjs tests/test_markdown_parser.cjs

      - name: Lint Markdown with locked dependencies
        run: python scripts/ci_toolchain.py run-markdownlint

      - name: Install documentation tools
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-docs.lock

      - name: Validate policy and lockfile synchronization
        run: python scripts/validate_tooling.py

      - name: Run documentation regression tests
        run: python -m unittest discover -s tests/docs -v

      - name: Validate documentation contract
        run: python scripts/validate_scaffold.py --repository-root .
      - name: Install reviewed core without lifecycle scripts
        working-directory: .github/actions/release-please
        run: npm ci --ignore-scripts --no-fund
      - name: Test the adapter and installed core contract
        working-directory: .github/actions/release-please
        run: npm test
      - name: Plan with the installed core and read-only token
        uses: ./.github/actions/release-please
        with:
          token: ${{ github.token }}
          dry-run: 'true'
      - name: Inspect all Action manifests and lockfiles at the proposed pins
        id: action_metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/action_dependencies.py --repository-root . --json-output "$RUNNER_TEMP/action-dependencies.json"
      - name: Retain proposed Action dependency metadata
        if: ${{ !cancelled() && steps.action_metadata.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-dependencies-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/action-dependencies.json
          if-no-files-found: warn
          retention-days: 7
