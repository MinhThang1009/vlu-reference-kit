name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-please-pr
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Đề xuất phiên bản và tạo bản phát hành nháp
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: false

  build-release-assets:
    name: build-release-assets
    needs: release-pr
    if: ${{ needs.release-pr.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.release-pr.outputs.release_sha }}
    steps:
      - name: Kiểm tra SHA phát hành
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release Please did not return a full SHA-1 release commit."
            exit 1
          fi
      - name: Lấy đúng snapshot phát hành
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.release_sha }}
          persist-credentials: false
      - name: Đọc runtime đã review
        id: runtime
        run: python scripts/runtime_policy.py release-runtime >> "$GITHUB_OUTPUT"
      - name: Chuẩn bị Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.runtime.outputs.python }}
      - name: Kiểm tra và đóng gói cộng đồng
        run: |
          python scripts/validate_kit.py
          python -m unittest discover -s tests -v
          python scripts/build_community_package.py
      - name: Kiểm tra ZIP và checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/vlu-reference-kit-community.zip
          test -s dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt
          mapfile -d '' -t files < <(find dist -maxdepth 1 -type f -print0)
          if [[ "${#files[@]}" -ne 2 ]]; then
            echo "::error::The release bundle must contain exactly the ZIP and SHA256SUMS.txt."
            exit 1
          fi
      - name: Chuyển artifact sang job upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5.0.0
        with:
          name: release-assets-${{ needs.release-pr.outputs.release_sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: '1'

  attach-release-assets:
    name: attach-release-assets
    needs:
      - release-pr
      - build-release-assets
    if: ${{ needs.release-pr.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-pr.outputs.release_sha }}
    steps:
      - name: Nhận artifact đã kiểm tra
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v5.0.0
        with:
          name: release-assets-${{ needs.release-pr.outputs.release_sha }}
          path: dist/
      - name: Kiểm tra draft và target trước khi upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release Please returned an invalid version tag."
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release Please returned an invalid release SHA."
            exit 1
          fi
          release_json="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [[ "$(jq -r '.draft // false' <<<"${release_json}")" != "true" ]]; then
            echo "::error::The target GitHub Release is not a draft."
            exit 1
          fi
          encoded_tag="$(jq -Rr @uri <<<"${RELEASE_TAG}")"
          ref_json="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")"
          object_type="$(jq -r '.object.type // empty' <<<"${ref_json}")"
          object_sha="$(jq -r '.object.sha // empty' <<<"${ref_json}")"
          for _ in {1..32}; do
            case "${object_type}" in
              commit)
                if [[ "${object_sha}" != "${RELEASE_SHA}" ]]; then
                  echo "::error::The release tag does not resolve to the Release Please commit."
                  exit 1
                fi
                break
                ;;
              tag)
                tag_json="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
                object_type="$(jq -r '.object.type // empty' <<<"${tag_json}")"
                object_sha="$(jq -r '.object.sha // empty' <<<"${tag_json}")"
                ;;
              *)
                echo "::error::The release tag resolved to an unexpected Git object."
                exit 1
                ;;
            esac
          done
          if [[ "${object_type}" != "commit" ]]; then
            echo "::error::The release tag has too many annotated layers."
            exit 1
          fi
      - name: Kiểm tra asset trước khi đính kèm
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/vlu-reference-kit-community.zip
          test -s dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt
          mapfile -d '' -t files < <(find dist -maxdepth 1 -type f -print0)
          if [[ "${#files[@]}" -ne 2 ]]; then
            echo "::error::Only the ZIP and SHA256SUMS.txt may be attached."
            exit 1
          fi
      - name: Đính kèm ZIP và checksum vào draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            --repo "github.com/${GITHUB_REPOSITORY}" \
            dist/vlu-reference-kit-community.zip dist/SHA256SUMS.txt --clobber
      - name: Xác minh asset đã được đính kèm
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [[ "$(jq -r '.draft // false' <<<"${release_json}")" != "true" ]]; then
            echo "::error::The Release changed from draft during asset upload."
            exit 1
          fi
          jq -e '
            ([.assets[]? | select(.name == "vlu-reference-kit-community.zip" and .size > 0)] | length) == 1 and
            ([.assets[]? | select(.name == "SHA256SUMS.txt" and .size > 0)] | length) == 1
          ' <<<"${release_json}" > /dev/null
