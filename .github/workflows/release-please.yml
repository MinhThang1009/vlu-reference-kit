name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-please-pr
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout trusted release adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up release runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install reviewed Release Please core
        working-directory: .github/actions/release-please
        run: npm ci --ignore-scripts --no-fund
      - name: Propose version and create draft Release
        id: release
        uses: ./.github/actions/release-please
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  build-release-assets:
    name: build-release-assets
    needs: release-pr
    if: ${{ needs.release-pr.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      statuses: read
    env:
      RELEASE_SHA: ${{ needs.release-pr.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
      RELEASE_COMMIT_SHA: ${{ needs.release-pr.outputs.release_sha }}
    steps:
      - name: Validate release SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release Please did not return a full SHA-1 release commit."
            exit 1
          fi
      - name: Checkout exact release snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.release_sha }}
          persist-credentials: false
      - name: Read reviewed runtime
        id: runtime
        run: python scripts/runtime_policy.py release-runtime >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.runtime.outputs.python }}
      - name: Wait for exact release commit CI
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if python scripts/verify_release.py; then
              exit 0
            fi
            if (( attempt == 30 )); then
              echo "::error::The release commit did not pass tag, main and CI verification."
              exit 1
            fi
            sleep 10
          done
      - name: Validate and package community kit
        run: |
          python scripts/validate_kit.py
          python -m unittest discover -s tests -v
          python scripts/build_community_package.py
      - name: Validate ZIP and checksum
        shell: bash
        run: &verify_release_bundle |
          set -euo pipefail
          if [[ ! -d dist || -L dist ]]; then
            echo "::error::The release bundle must be a local directory."
            exit 1
          fi
          shopt -s nullglob dotglob
          entries=(dist/*)
          if [[ "${#entries[@]}" -ne 2 ]]; then
            echo "::error::The release bundle must contain only the ZIP and SHA256SUMS.txt."
            exit 1
          fi
          for asset in dist/vlu-reference-kit-community.zip dist/SHA256SUMS.txt; do
            if [[ ! -f "${asset}" || -L "${asset}" || ! -s "${asset}" ]]; then
              echo "::error::Required release assets must be nonempty regular files."
              exit 1
            fi
          done
          if [[ "$(wc -c < dist/SHA256SUMS.txt)" -gt 256 ]]; then
            echo "::error::The checksum file exceeds the expected single-entry size."
            exit 1
          fi
          mapfile -t checksum_lines < dist/SHA256SUMS.txt
          if [[ "${#checksum_lines[@]}" -ne 1 ]]; then
            echo "::error::The checksum file must contain exactly one entry."
            exit 1
          fi
          if [[ ! "${checksum_lines[0]}" =~ ^[0-9a-f]{64}\ \ vlu-reference-kit-community\.zip$ ]]; then
            echo "::error::The checksum entry must name only the expected ZIP."
            exit 1
          fi
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)
      - name: Transfer artifact to upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ needs.release-pr.outputs.release_sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: '1'

  attest-release-assets:
    name: attest-release-assets
    needs:
      - release-pr
      - build-release-assets
    if: ${{ needs.release-pr.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Receive verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ needs.release-pr.outputs.release_sha }}
          path: dist/
      - name: Validate downloaded artifacts
        shell: bash
        run: *verify_release_bundle
      - name: Attest ZIP and checksum
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/**

  attach-release-assets:
    name: attach-release-assets
    concurrency:
      group: vlu-community-release-${{ needs.release-pr.outputs.tag_name }}
      cancel-in-progress: false
    needs:
      - release-pr
      - build-release-assets
      - attest-release-assets
    if: ${{ needs.release-pr.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-pr.outputs.release_sha }}
    steps:
      - name: Receive verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ needs.release-pr.outputs.release_sha }}
          path: dist/
      - name: Validate draft and target before upload
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_number='(0|[1-9][0-9]*)'
          release_prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          release_build='[0-9A-Za-z-]+([.][0-9A-Za-z-]+)*'
          release_tag_pattern="^v${release_number}[.]${release_number}[.]${release_number}(-${release_prerelease}([.]${release_prerelease})*)?([+]${release_build})?$"
          if [[ "${#RELEASE_TAG}" -gt 128 || ! "${RELEASE_TAG}" =~ ${release_tag_pattern} ]]; then
            echo "::error::Release Please returned an invalid version tag."
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release Please returned an invalid release SHA."
            exit 1
          fi
          release_json="$(gh api --hostname github.com --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq 'map(select(.tag_name == env.RELEASE_TAG))[0]')"
          if [[ -z "${release_json}" || "${release_json}" == "null" ]]; then
            echo "::error::Could not find the draft Release by tag."
            exit 1
          fi
          if [[ "$(jq -r '.draft // false' <<<"${release_json}")" != "true" ]]; then
            echo "::error::The target GitHub Release is not a draft."
            exit 1
          fi
          release_id="$(jq -r '.id // empty' <<<"${release_json}")"
          if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::The target GitHub Release has no valid numeric ID."
            exit 1
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
      - name: Verify release tag before upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: &verify_release_tag |
          set -euo pipefail
          encoded_tag="$(jq -Rr @uri <<<"${RELEASE_TAG}")"
          ref_json="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")"
          object_type="$(jq -r '.object.type // empty' <<<"${ref_json}")"
          object_sha="$(jq -r '.object.sha // empty' <<<"${ref_json}")"
          for _ in {1..32}; do
            if [[ ! "${object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The release tag API returned an invalid commit or tag SHA."
              exit 1
            fi
            case "${object_type}" in
              commit)
                break
                ;;
              tag)
                tag_json="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
                object_type="$(jq -r '.object.type // empty' <<<"${tag_json}")"
                object_sha="$(jq -r '.object.sha // empty' <<<"${tag_json}")"
                ;;
              *)
                echo "::error::The release tag resolved to an unexpected Git object."
                exit 1
                ;;
            esac
          done
          if [[ "${object_type}" != "commit" ]]; then
            echo "::error::The release tag has too many annotated layers."
            exit 1
          fi
          if [[ "${object_sha}" != "${RELEASE_SHA}" ]]; then
            echo "::error::The release tag does not resolve to the Release Please commit."
            exit 1
          fi
      - name: Validate assets before attaching
        shell: bash
        run: *verify_release_bundle
      - name: Attach ZIP and checksum to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            --repo "github.com/${GITHUB_REPOSITORY}" \
            dist/vlu-reference-kit-community.zip dist/SHA256SUMS.txt --clobber
      - name: Verify attached assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release_state.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r '.draft // false' <<<"${release_json}")" != "true" ]]; then
            echo "::error::The Release changed from draft during asset upload."
            exit 1
          fi
          jq -e '
            (.draft == true) and (.tag_name == env.RELEASE_TAG) and
            ([.assets[]? | select(.name == "vlu-reference-kit-community.zip" and .size > 0)] | length) == 1 and
            ([.assets[]? | select(.name == "SHA256SUMS.txt" and .size > 0)] | length) == 1
          ' <<<"${release_json}" > /dev/null
      - name: Verify release tag before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: *verify_release_tag
      - name: Publish Release after assets and attestation pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release_state.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --hostname github.com --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false > "$RUNNER_TEMP/published-release.json"
          jq -e '
            (.draft == false) and (.tag_name == env.RELEASE_TAG) and
            ([.assets[]? | select(.name == "vlu-reference-kit-community.zip" and .size > 0)] | length) == 1 and
            ([.assets[]? | select(.name == "SHA256SUMS.txt" and .size > 0)] | length) == 1
          ' "$RUNNER_TEMP/published-release.json" > /dev/null
      - name: Verify release tag after publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: *verify_release_tag
      - name: Verify published Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release_state.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/published-release.json" ]] &&
            jq -e '
              (.draft == false) and (.tag_name == env.RELEASE_TAG) and
              ([.assets[]? | select(.name == "vlu-reference-kit-community.zip" and .size > 0)] | length) == 1 and
              ([.assets[]? | select(.name == "SHA256SUMS.txt" and .size > 0)] | length) == 1
            ' "$RUNNER_TEMP/published-release.json" > /dev/null; then
            exit 0
          fi
          for attempt in {1..30}; do
            release_json="$(gh api --hostname github.com -H 'Cache-Control: no-cache' "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
            if [[ -n "${release_json}" && "${release_json}" != "null" ]] &&
              [[ "$(jq -r '.draft == false' <<<"${release_json}")" == "true" ]] &&
              jq -e '
                (.tag_name == env.RELEASE_TAG) and
                ([.assets[]? | select(.name == "vlu-reference-kit-community.zip" and .size > 0)] | length) == 1 and
                ([.assets[]? | select(.name == "SHA256SUMS.txt" and .size > 0)] | length) == 1
              ' <<<"${release_json}" > /dev/null; then
              exit 0
            fi
            if (( attempt == 30 )); then
              echo "::error::The Release was not published after verification retries."
              exit 1
            fi
            sleep 2
          done
