name: Repository freshness monitoring

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: freshness-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Check upstream versions
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python scripts/audit_freshness.py \
            --repository-root . \
            --json-output "$RUNNER_TEMP/freshness.json" \
            --markdown-output "$RUNNER_TEMP/freshness.md"
          checker_exit=$?
          set -e
          if [[ ! -f "$RUNNER_TEMP/freshness.md" ]]; then
            printf '%s\n' \
              '<!-- repo-scaffold-freshness-audit -->' \
              '# Repository freshness review' \
              '' \
              'The checker failed before it could produce a report. Inspect this workflow run.' \
              > "$RUNNER_TEMP/freshness.md"
            checker_exit=2
          fi
          printf 'checker_exit=%s\n' "$checker_exit" >> "$GITHUB_OUTPUT"

      - name: Write audit report
        shell: bash
        run: cat "$RUNNER_TEMP/freshness.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain full Action manifest and lockfile evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freshness-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/freshness.json
            ${{ runner.temp }}/freshness.md
          if-no-files-found: error
          retention-days: 7

      - name: Sync reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECKER_EXIT: ${{ steps.audit.outputs.checker_exit }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- repo-scaffold-freshness-audit -->'
          title='Review repository freshness findings'
          issue_numbers_output=$(
            gh api --hostname github.com --paginate \
              "repos/${REPOSITORY}/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | select((.body // "") | contains("<!-- repo-scaffold-freshness-audit -->")) | .number'
          )
          issue_numbers=()
          if [[ -n "$issue_numbers_output" ]]; then
            mapfile -t issue_numbers <<< "$issue_numbers_output"
          fi
          if (( ${#issue_numbers[@]} > 1 )); then
            printf 'Found multiple open freshness reminder issues.\n' >&2
            exit 1
          fi
          if [[ "$CHECKER_EXIT" == '0' ]]; then
            if (( ${#issue_numbers[@]} == 1 )); then
              gh issue close "${issue_numbers[0]}" \
                --repo "github.com/${REPOSITORY}" \
                --comment 'Freshness check passed; closing this reminder automatically.'
            fi
            exit 0
          fi
          grep -Fq "$marker" "$RUNNER_TEMP/freshness.md"
          if (( ${#issue_numbers[@]} == 1 )); then
            gh issue edit "${issue_numbers[0]}" \
              --repo "github.com/${REPOSITORY}" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/freshness.md"
          else
            gh issue create \
              --repo "github.com/${REPOSITORY}" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/freshness.md"
          fi
          if [[ "$CHECKER_EXIT" != '0' ]]; then
            exit 1
          fi
